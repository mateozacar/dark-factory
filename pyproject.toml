[project]
name = "dark-factory"
version = "0.1.0"
description = "Dark Factory Earthquake API — stateless USGS proxy with Clean Architecture"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dark_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]
exclude = [".claude", ".bmad", "_bmad", "_bmad-output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test files are human-owned and may not be modified; relax style rules.
"tests/**/*.py" = ["E501", "F401", "I001", "UP037"]
# CI scripts contain long AI prompt strings — exempt E501.
".github/scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
