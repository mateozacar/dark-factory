      _(approximation based on character count / 4; verify in API dashboard)_"
10. Memory maintenance — keep cost-log lean:
    Read _bmad-output/implementation-artifacts/cost-log.md. Count data rows (excluding header).
    If row count > 20:
    a. Sum the ~Cost USD column for all rows except the last 10.
    b. Replace those older rows with one archive row:
       | <first-date> → <last-archived-date> | (archived) | various | — | — | $<sum> |
    c. Keep the last 10 data rows intact below the archive row.
    d. Write the pruned file back.
"""

# Three-phase TDD with automated gate — fully unattended.
# Phase 0: file discovery using the cheap model (fast scan, no reasoning required).
# Phase 1: test scaffolding using the cheap model (mechanical mirroring of ACs into test stubs).
# Phase 2: implementation using the deep model (complex reasoning required).
# Model tiers are defined in _bmad/custom/config.toml [models] section.
implementation_handoff = """
## TDD — Three Phases, Automated Gate

### PHASE 0 — File Discovery (cheap model)

Launch a subagent using the cheap model (read key `models.cheap` in `_bmad/custom/config.toml`) with no prior conversation context:

> Read {spec_file}. Identify every source file that needs to be created or modified to satisfy the acceptance criteria.
> Return a compact JSON array: [{"path": "src/...", "action": "create|modify", "serves_ac": "AC-1"}]
> Do NOT implement anything. Read the spec and existing file structure only.

Capture the file list from Phase 0. Use it to scope Phase 1 and Phase 2 subagents — they load only those specific files, not the full codebase.

### PHASE 1 — Tests First (cheap model)

Launch a subagent using the cheap model (read key `models.cheap` in `_bmad/custom/config.toml`) — test scaffolding is mechanical, it mirrors ACs into test stubs and does not require deep reasoning — with no prior conversation context:

> Read {spec_file} fully. Your SOLE task is writing tests — write NO implementation code whatsoever.
>
> Relevant files identified by Phase 0: <insert Phase 0 file list here>
>
> For every acceptance criterion:
> - Write test(s) using the project's existing test framework (pytest + anyio, see tests/ directory).
> - Tests must be syntactically valid but FAIL because the implementation does not exist yet.
> - Mirror AC structure in test descriptions.
> - Cover every row in any I/O or edge-case matrix.
>
> When done:
> 1. List every test file written (repo-relative path with first line number).
> 2. Run `uv run pytest tests/ -q` and paste the complete output.
> 3. Confirm: output must contain FAILED/FAIL lines, not syntax or import errors.

### AUTOMATED GATE

After receiving the Phase 1 report, verify autonomously:

1. Does the test output contain FAILED or FAIL? → gate PASSES:
   - Run: gh issue comment {num} --repo mateozacar/dark-factory --body "Tests written and gate passed — starting implementation."
   - Proceed to Phase 2 immediately.
2. Does the output contain ERROR / SyntaxError / ImportError before any test executed? → gate FAILS.
3. On gate FAIL: relaunch Phase 1 subagent with added instruction:
   "Previous run had errors before tests reached assertions. Fix syntax/import issues.
    Tests must reach the assertion stage and fail there — not before."
   Retry the gate. Max 2 retries. After 2 failures:
   - Run: gh issue comment {num} --repo mateozacar/dark-factory --body "BLOCKED: test gate failed after 2 retries. Manual intervention required."
   - Run: gh issue edit {num} --repo mateozacar/dark-factory --add-label "blocked" --remove-label "in-progress"
   - HALT.

### PHASE 2 — Implement to Green (deep model)

Launch a subagent using the deep model (read key `models.deep` in `_bmad/custom/config.toml`) with no prior conversation context:

> Read {spec_file} fully — it is your sole source of truth.
> Load the files identified in Phase 0 (or the spec's frontmatter `context:` if no Phase 0 list is available).
>
> Tests are already written and the gate passed. Write ONLY implementation code.
> Do NOT modify, add, or delete any test file.
>
> When done:
> 1. Run `uv run pytest tests/ -q` — all tests must pass.
> 2. Run `uv run ruff check . && uv run mypy src/` — must be clean.
> 3. Report: changed files, complete test output, complete lint output, any risks.

After receiving the Phase 2 report, run:
  gh issue comment {num} --repo mateozacar/dark-factory --body "Implementation complete. All tests passing, lint clean — proceeding to review."
"""
