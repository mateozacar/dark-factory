      For a quick single-number estimate: apply the full base input rate to all input tokens (slight overestimate).
   b. Calculate cost using the table above. If multiple models were used (Phase 0/1 vs Phase 2), estimate each separately and sum.
   c. Append a row to the `## Cost Log` section at the bottom of {spec_file}.
      If the section does not exist, add it:
      ## Cost Log
      | Date (UTC) | Phase | Model | ~Input tkns | ~Output tkns | ~Cost USD |
      |------------|-------|-------|------------|--------------|-----------|
      Then append:
      | YYYY-MM-DD | build-auto | <model> | <n> | <n> | $<n> |
   d. Append a row to `{project-root}/_bmad-output/implementation-artifacts/cost-log.md`.
      Create the file with a header if it does not exist:
      # Cost Log
      | Date (UTC) | Issue | Phase | Model | ~Input tkns | ~Output tkns | ~Cost USD |
      |------------|-------|-------|-------|------------|--------------|-----------|
