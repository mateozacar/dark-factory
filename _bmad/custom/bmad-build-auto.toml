# Dark-Factory team override for bmad-build-auto.
# Loop completamente desatendido: spec → branch → tests → impl → review → commit → PR.
# Ningun human gate. La unica intervencion humana es escribir el intent inicial.
# GitHub operations use the gh CLI (MCP permissions unavailable in interactive sessions).
# Model tiers: cheap (discovery + test scaffolding) and deep (implementation) — see _bmad/custom/config.toml [models].

[workflow]

# CONTEXT ORDER — static content first for prompt caching.
# AGENTS.md and architecture rarely change → stable cached prefix.
# Specs are NOT pre-loaded here — each subagent loads {spec_file} directly to avoid
# paying for all specs on every call (context as budget: only load what's needed).
# Critical mandates are last in the block → never buried in the middle of large context.
persistent_facts = [
  # 1. Most static — project rules (primary cache candidate)
  "file:{project-root}/AGENTS.md",
  # 2. Rarely changes — architecture spine only (excludes briefs and memlogs)
  "file:{project-root}/_bmad-output/planning-artifacts/architecture/*/ARCHITECTURE-SPINE.md",
  # 3. Semi-static — project conventions
  "The project GitHub repository is mateozacar/dark-factory (owner: mateozacar, repo: dark-factory).",
  "Branch convention (GitHub Flow): feature/DARK-{num}-{slug} for new features, bugfix/DARK-{num}-{slug} for bug fixes, hotfix/DARK-{num}-{slug} for urgent fixes, chore/DARK-{num}-{slug} for maintenance. All branches are created from main.",
  # 4. Critical mandates — last in static context, just before the actionable prompt (never buried)
  "TDD mandate: Tests MUST be written first and MUST fail before implementation begins. The automated gate is the only gate — no human approval.",
  "Quality gate: ALL of the following must pass before the PR is created: uv run pytest tests/ -q (zero failures), uv run ruff check . (zero violations), uv run mypy src/ (zero errors).",
]

activation_steps_append = [
  """
Before starting implementation, extract the issue number and change type from the spec or the provided intent:
- Look for a GitHub issue number in the spec frontmatter, title, or the user's intent message.
  If found, use it as {num}.
  If not found, run:
    gh issue create --repo mateozacar/dark-factory \
      --title "<spec title>" \
      --body "<spec description and acceptance criteria>" \
      --label "spec-ready"
  Use the returned issue number as {num}.
  Add the created issue to the GitHub Project "Earthquake":
    gh project item-add 1 --owner mateozacar --url <issue-url>
- Determine {type}: feature | bugfix | hotfix | chore — infer from the spec content if not explicit.
- Build the branch name: {type}/DARK-{num}-{short-slug} where {short-slug} is a 2-4 word kebab-case summary.
- Run in sequence:
  1. git checkout main
  2. git pull origin main
  3. git checkout -b {branch-name}
- Confirm the branch was created. If it already exists, check it out — do not abort.
- Update the GitHub issue via gh CLI:
  1. Ensure these labels exist in mateozacar/dark-factory (create if missing):
       gh label create "in-progress" --color "#0075ca" --repo mateozacar/dark-factory
       gh label create "blocked" --color "#d93f0b" --repo mateozacar/dark-factory
  2. Add the label "in-progress" to issue {num}:
       gh issue edit {num} --add-label "in-progress" --repo mateozacar/dark-factory
  3. Add a comment to issue {num}:
       gh issue comment {num} --body "Branch created: \`{branch-name}\` — automated implementation loop starting." --repo mateozacar/dark-factory
""",
]

on_complete = """
After all review layers pass:
1. Run the full quality gate one final time:
   uv run pytest tests/ -q && uv run ruff check . && uv run mypy src/
   If anything fails, fix it before continuing — do not create a PR with a failing gate.
2. Stage only the changed files by name (never use git add -A or git add .).
3. Create a commit using Conventional Commits format:
   "feat|fix|chore: <short description> (#<issue-num>)"
4. Push the branch:
   git push -u origin {branch-name}
5. Create a Pull Request via gh CLI:
   gh pr create --repo mateozacar/dark-factory \
     --base main \
     --head "{branch-name}" \
     --title "<commit title>" \
     --body "## Summary
   <1-3 bullet points describing what was implemented>

   ## Automated verification
   - All tests passed (\`uv run pytest tests/ -q\`)
   - Ruff and mypy clean (\`uv run ruff check . && uv run mypy src/\`)
   - Verified against spec acceptance criteria

   Closes #<issue-num>"
6. Add a comment to the issue:
   gh issue comment <issue-num> --repo mateozacar/dark-factory \
     --body "PR created: <pr-url> — CI and automated review running. Auto-merge will be enabled by the review pipeline once the review approves or the fix threshold is reached."
7. DO NOT run `gh pr merge` — auto-merge is the review pipeline's responsibility.
   The PR Review workflow (pr-review.yml) enables auto-merge after:
   - The review approves (APPROVE decision), or
   - One auto-fix cycle has completed (threshold = 1 cycle, prevents infinite loops).
   CI is always required before the actual merge happens.
8. Report the PR URL.
9. Calculate and persist session cost:

   PRICING REFERENCE (per million tokens):
   | Model                           | Input   | Output  |
   |---------------------------------|---------|---------|
   | Claude Opus 4 (deep)            | $15.00  | $75.00  |
   | Claude Opus 4 — cache write     | $18.75  | $75.00  |
   | Claude Opus 4 — cache read      | $1.50   | $75.00  |
   | Claude Sonnet 4.x (cheap)       | $3.00   | $15.00  |
   | Claude Sonnet 4.x — cache write | $3.75   | $15.00  |
   | Claude Sonnet 4.x — cache read  | $0.30   | $15.00  |
   | Claude Haiku 4.5                | $0.80   | $4.00   |
   | Claude Haiku 4.5 — cache read   | $0.08   | $4.00   |
   | GPT-4o                          | $2.50   | $10.00  |
   | GPT-4o-mini                     | $0.15   | $0.60   |
   | o3                              | $10.00  | $40.00  |
   | o4-mini                         | $1.10   | $4.40   |

   a. Estimate tokens: total characters processed across the full loop / 4.
      - Static input (AGENTS.md + architecture, loaded once per loop): likely cached after the first call.
        Cache read = $0.30/MTok for Sonnet 4.x (cheap), $1.50/MTok for Opus 4 (deep).
      - Variable input (spec + subagent prompts + conversation received): full input rate per model used.
