# Dark-Factory team override for bmad-build.
# Enforces GitHub Flow branch creation at start, automated TDD verification, and push + PR at end.
# GitHub operations use the GitHub MCP tool, not the gh CLI.

[workflow]

persistent_facts = [
  "The project GitHub repository is mateozacar/dark-factory (owner: mateozacar, repo: dark-factory).",
  "Branch convention (GitHub Flow): feature/DARK-{num}-{slug} for new features, bugfix/DARK-{num}-{slug} for bug fixes, hotfix/DARK-{num}-{slug} for urgent fixes, chore/DARK-{num}-{slug} for maintenance. All branches are created from main.",
  "file:{project-root}/AGENTS.md",
  "file:{project-root}/_bmad-output/planning-artifacts/**/*.md",
  "TDD mandate: Tests are written first. They must FAIL (not error) before implementation begins. The automated gate verifies this — no human approval is needed, the test output is the gate.",
]

activation_steps_append = [
  """
Before clarifying the spec or starting implementation, ask the user two questions:
  Q1. What is the GitHub issue number for this work? (enter the number, or 'new' if no issue exists yet)
  Q2. What type of change is this? Options: feature | bugfix | hotfix | chore
Using the answers, build the branch name following the convention: {type}/DARK-{num}-{short-slug}.
Then run these git commands in sequence:
  1. git checkout main
  2. git pull origin main
  3. git checkout -b {branch-name}
Confirm the branch was created successfully and display the branch name before proceeding.
Then update the GitHub issue using the GitHub MCP tool:
  1. Ensure the label "in-progress" exists in mateozacar/dark-factory (color #0075ca). Create it if missing.
  2. Add the label "in-progress" to issue {num}.
  3. Add a comment to issue {num}: "Branch created: `{branch-name}` — implementation starting."
""",
]

on_complete = """
After implementation and review are complete:
1. Stage the changed files by name (never use git add -A or git add .).
2. Create a commit using Conventional Commits format referencing the issue number:
   "feat|fix|chore: <short description> (#<issue-num>)"
3. Push the branch: git push -u origin {branch-name}
4. Use the GitHub MCP tool to create a Pull Request in mateozacar/dark-factory:
   - base: "main"
   - head: "{branch-name}"
   - title: same as the commit title
   - body:
     ## Summary
     <1-3 bullet points summarising what was implemented>

     ## Test plan
     - [ ] All tests pass (`uv run pytest`)
     - [ ] Ruff and mypy pass (`uv run ruff check . && uv run mypy src/`)
     - [ ] Verified against acceptance criteria in the spec

     Closes #<issue-num>
5. Use the GitHub MCP tool to add a comment to issue <issue-num>:
   "PR created: <pr-url> — CI running. Issue will close automatically when PR merges."
6. Report the PR URL to the user.
"""

# TDD: two phases separated by an automated verification gate — no human approval.
# The gate checks that tests FAIL for the right reason (missing implementation),
# not due to syntax errors or incorrect setup. If the gate passes, Phase 2 starts
# automatically. If it fails, Phase 1 is retried with corrections (max 2 retries).
implementation_handoff = """
## TDD Implementation — Two Phases with Automated Gate

### PHASE 1 — Write Tests First (no implementation code)

Launch a subagent with no prior conversation context, with this prompt:

> Read {spec_file} fully. Your SOLE task is writing tests — write NO implementation code whatsoever.
>
> For every acceptance criterion in the spec's "Tasks & Acceptance" section:
> - Write test(s) expressing the expected behaviour using the project's existing test framework and conventions.
> - Tests must be syntactically valid and runnable, but must FAIL because the implementation does not exist yet.
> - Mirror the Given/When/Then structure of each AC in the test descriptions.
> - If the spec contains an I/O & Edge-Case Matrix, every matrix row must have at least one covering test.
>
> When done, report:
> 1. Every test file written (CWD-relative paths with line notation, e.g. tests/unit/test_foo.py:12).
> 2. The exact command to run the tests.
> 3. The failing test output — run the tests and paste the complete result.

### AUTOMATED GATE — verify tests fail correctly, then proceed

After receiving the Phase 1 report, run this verification autonomously (no human approval):

1. Parse the test output from the report.
2. Check: does the output contain FAILED or FAIL lines? → gate PASSES.
3. Check: does the output contain ERROR, SyntaxError, ImportError before any test ran? → gate FAILS.
4. If gate PASSES:
   - Use the GitHub MCP tool to add a comment to issue {num} in mateozacar/dark-factory:
     "Tests written and verified failing. Gate passed — starting implementation."
   - Proceed immediately to Phase 2.
5. If gate FAILS → relaunch the Phase 1 subagent with these added instructions:
   "The previous test run produced errors before tests executed (syntax/import issues). Fix those errors.
    The tests must reach the assertion stage and fail there — not before."
   Retry the gate. Maximum 2 retries. If still failing after 2 retries:
   - Use the GitHub MCP tool to add a comment to issue {num}:
     "BLOCKED: test gate failed after 2 retries. Manual intervention required."
   - HALT.

### PHASE 2 — Implement to Green

Launch a subagent with no prior conversation context, with this prompt:

> Read {spec_file} fully — it is your sole source of truth. Load every file listed in its frontmatter `context:` before you start.
>
> The test suite is already written and verified. Your job is ONLY to write the implementation code that makes those tests pass — do NOT add, remove, or modify any test file.
>
> When done: run `uv run pytest tests/ -q` and `uv run ruff check . && uv run mypy src/` — report the complete output. All tests must pass and linting must be clean before reporting done.
"""
